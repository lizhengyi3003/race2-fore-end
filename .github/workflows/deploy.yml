name: Deploy Cloudflare
on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  deployments: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://intellicoretech.cn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy and verify the public site
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$latest" != "$REVISION" ]; then
            echo 'Skipping superseded revision'
            exit 0
          fi
          npx wrangler deploy
          for origin in https://intellicoretech.cn https://api.intellicoretech.cn; do
            curl --fail --silent --show-error --max-time 15 --retry 4 --retry-all-errors "$origin/healthz" |
              jq -e '.status == "ok" and .service == "race3-frontend"'
            curl --fail --silent --show-error --max-time 15 --retry 4 --retry-all-errors "$origin/api/v1/dashboard/stats" |
              jq -e '.code == 200 and (.data.totalAssess | type == "number")'
          done
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
